<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if form.email.errors %}Error: {% endif %}{{ title }}</title>
</head>
<body>
<h1>{{ title }}</h1>
<p>Forgotten your password? Enter your email address below, and we’ll email instructions for setting a new one.</p>
<form method="post">
{% csrf_token %}
{{ form.email.errors }}
<p><label for="id_email">Email address:</label>
{{ form.email }}</p>
<p><button type="submit">Reset my password</button></p>
</form>
</body>
</html>
