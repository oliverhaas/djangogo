name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      # Optional: upload coverage to Codecov.
      # - uses: codecov/codecov-action@v5
      #   with:
      #     files: ./coverage.txt
      #     fail_ci_if_error: false

  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install "django==6.0.3"
      - run: python3 fidelity/oracle/generate.py
      - name: Fail if golden files drift from a fresh Django run
        run: git diff --exit-code fidelity/golden/

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: djangogo
          POSTGRES_PASSWORD: djangogo
          POSTGRES_DB: djangogo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djangogo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGOGO_TEST_POSTGRES_DSN: postgres://djangogo:djangogo@localhost:5432/djangogo?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
